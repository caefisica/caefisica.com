[tools]
wrangler = "4.151.2"
actionlint = "1.7.12"
"npm:netlify-cli" = { version = "27.14.0", trust_policy_excludes = [
  "@netlify/serverless-functions-api@2.24.0",
] }
bun = "1.4.3"
go = "1.27.2"
hugo-extended = "0.168.0"
node = "26.12.0"
"go:github.com/gohugoio/gotmplfmt" = "0.5.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install dependencies from bun.lock"
run = "bun install --frozen-lockfile"

[tasks."install:browser"]
description = "Install the Chromium that the screenshots task drives"
depends = ["install"]
run = "bunx playwright install --with-deps chromium"

[tasks.lint]
description = "Check scripts, styles, templates, Markdown and formatting"
depends = ["lint:*"]

[tasks."lint:scripts"]
description = "Lint the JavaScript and TypeScript"
depends = ["install"]
run = "oxlint --deny-warnings assets/js config scripts"

[tasks."lint:markdown"]
description = "Lint the Markdown"
depends = ["install"]
run = "markdownlint-cli2 '**/*.md' '!node_modules/**'"

[tasks."lint:templates"]
description = "Check the Hugo templates are formatted"
run = "test -z \"$(gotmplfmt -l layouts data)\""

[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows"
run = "actionlint"

[tasks."lint:format"]
description = "Check the formatting of scripts, Markdown, YAML and JSON"
depends = ["install"]
run = "oxfmt --check ."

[tasks.fix]
description = "Apply safe fixes and format every file"
depends = ["install"]
run = [
  "gotmplfmt -w layouts data",
  "oxfmt .",
  "markdownlint-cli2 --fix '**/*.md' '!node_modules/**'",
]

[tasks.typecheck]
description = "Type-check the TypeScript"
depends = ["install"]
run = "tsc --noEmit"

[tasks."copy:fonts"]
description = "Copy the KaTeX fonts to static/fonts"
depends = ["install"]
run = "shx cp 'node_modules/katex/dist/fonts/*' static/fonts/"

[tasks.build]
description = "Build the site into public/ and index it for search"
depends = ["copy:fonts"]
run = ["hugo --gc --minify", "pagefind --site public"]

[tasks."build:preview"]
description = "Build and index the site with drafts and future-dated pages"
depends = ["copy:fonts"]
run = ["hugo --gc --minify -D -F", "pagefind --site public"]

[tasks.deploy]
description = "Build the site once and deploy it to Cloudflare and Netlify"
depends = ["deploy:*"]

[tasks."deploy:cloudflare"]
description = "Build the site and deploy it to Cloudflare"
depends = ["build"]
run = "wrangler deploy"

[tasks."deploy:netlify"]
description = "Build the site and deploy it to the Netlify production site"
depends = ["build"]
run = "netlify deploy --prod --no-build --dir public --site \"$NETLIFY_SITE_ID\""

[tasks.check]
description = "Run every check that CI runs"
depends = ["lint", "typecheck", "build"]

[tasks.dev]
description = "Serve the site on localhost:1313, drafts and search included"
depends = ["build"]
run = "hugo server --bind=127.0.0.1 --port=1313 --disableFastRender --buildDrafts --buildFuture"

[tasks.new]
description = "Create a content file with hugo new"
run = "hugo new"

[tasks.screenshots]
description = "Regenerate the screenshots in content/experimental"
depends = ["install"]
run = "bun scripts/screenshots.ts"

[tasks.clean]
description = "Remove build output and node_modules"
run = "shx rm -rf public resources node_modules"
