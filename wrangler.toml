name = "web"
account_id = "165a663123262d8ba6c08e92cff7e056"
compatibility_date = "2025-07-31"
main = "./worker/index.ts"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[[analytics_engine_datasets]]
binding = "SEARCHES"
dataset = "searches"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
