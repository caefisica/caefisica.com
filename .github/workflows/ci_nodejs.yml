name: checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      HUGO_VERSION: "0.166.0"
      DART_SASS_VERSION: 1.105.0

    steps:
      - run: |
          sudo apt-get update -y
          sudo apt-get install -y libvips git-lfs

      - uses: actions/checkout@v7
        with:
          lfs: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install Dart Sass
        run: |
          mkdir -p "${HOME}/.local"
          curl -sLJO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          tar -C "${HOME}/.local" -xf "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          rm "dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - run: bun install --frozen-lockfile

      - name: Install gotmplfmt
        run: go install github.com/gohugoio/gotmplfmt@latest

      - name: Check template formatting
        run: gotmplfmt -l layouts data | grep . && exit 1 || true

      - name: lint + typecheck
        run: bun run check
