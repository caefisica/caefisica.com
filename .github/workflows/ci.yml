name: checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A push to master must not cancel a deploy in progress.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: bun run check

  deploy:
    needs: check
    if: >-
      github.ref == 'refs/heads/master' && (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      CF_SEND_TELEMETRY: "false"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}

    steps:
      - name: Require the deploy credentials
        run: |
          missing=0
          for secret in CLOUDFLARE_API_TOKEN NETLIFY_AUTH_TOKEN; do
            if [ -z "${!secret}" ]; then
              echo "::error::The $secret secret is not set. Add it under Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::The NETLIFY_SITE_ID variable is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            missing=1
          fi
          exit "$missing"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      - run: bun run deploy

  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      CF_SEND_TELEMETRY: "false"
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
      ALIAS: pr-${{ github.event.number }}

    steps:
      # A fork or Dependabot pull request runs without secrets.
      - id: access
        env:
          FORK:
            ${{ github.event.pull_request.head.repo.full_name !=
            github.repository }}
          BOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          if [ "$FORK" = true ]; then
            echo "::notice::No preview: a pull request from a fork has no access to the NETLIFY_AUTH_TOKEN secret."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif [ "$BOT" = true ]; then
            echo "::notice::No preview: a Dependabot pull request has no access to the NETLIFY_AUTH_TOKEN secret."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.access.outputs.enabled == 'true'
        name: Require the preview credentials
        run: |
          missing=0
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::The NETLIFY_AUTH_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions."
            missing=1
          fi
          if [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::The NETLIFY_SITE_ID variable is not set. Add it under Settings > Secrets and variables > Actions > Variables."
            missing=1
          fi
          exit "$missing"

      - if: steps.access.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - if: steps.access.outputs.enabled == 'true'
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4

      # Netlify serves an alias at https://<alias>--<site name>.netlify.app.
      - if: steps.access.outputs.enabled == 'true'
        name: Build for the alias URL
        run: |
          name=$(netlify api getSite --data "{\"site_id\": \"$NETLIFY_SITE_ID\"}" | jq -r .name)
          HUGO_BASEURL="https://$ALIAS--$name.netlify.app/" bun run build

      - if: steps.access.outputs.enabled == 'true'
        name: Deploy the preview
        run: |
          url=$(netlify deploy --no-build --dir public --site "$NETLIFY_SITE_ID" --alias "$ALIAS" --json | jq -r .deploy_url)
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

  lighthouse:
    needs: deploy
    uses: ./.github/workflows/audit_lighthouse.yml
