name: lighthouse

on:
  workflow_dispatch:
  check_run:
    types: [completed]

jobs:
  lighthouse:
    # Cloudflare reports its deploy as a check run, not a workflow. Wait for it to succeed on master before auditing.
    if: >-
      github.event_name == 'workflow_dispatch' || (github.event.check_run.name
      == 'Workers Builds: web' && github.event.check_run.conclusion == 'success'
      && github.event.check_run.check_suite.head_branch == 'master')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://web.caefisica.workers.dev/
            https://web.caefisica.workers.dev/blog/
          budgetPath: ./.github/budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true
