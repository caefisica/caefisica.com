name: url health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**"
  push:
    branches: [master]
    paths:
      - "content/**"
  schedule:
    - cron: "0 0 * * 1"

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: atalent-labs/404-links@2dddde704a1633e9a55ad78d36a0149de9c89d5a # 3.1.6
        env:
          GITHUB_TOKEN: ${{ secrets.LINK_CHECK_404 }}
