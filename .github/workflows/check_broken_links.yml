name: url health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**"
      - lychee.toml
  push:
    branches: [master]
    paths:
      - "content/**"
      - lychee.toml
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a # v5.2.10

      # lychee reads GITHUB_TOKEN to raise the rate limit on github.com links.
      - run: bun run links
        env:
          GITHUB_TOKEN: ${{ github.token }}
