name: url health

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "content/**"
      - lychee.toml
  push:
    branches: [master]
    paths:
      - "content/**"
      - lychee.toml
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      # lychee reads GITHUB_TOKEN to raise the rate limit on github.com links.
      - run: bun run links
        env:
          GITHUB_TOKEN: ${{ github.token }}
