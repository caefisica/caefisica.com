# One menu feeds the header, the footer and the search suggestions, so the three cannot drift.
# Internal entries use pageRef so a moved page fails the build instead of leaving a dead link.
# A parent entry has only an identifier: it opens a dropdown and is a footer column.
# params.description is the line under the name in the dropdown and the search suggestions.
# params.suggest puts the entry in the search suggestions.

[[main]]
name = "Estudiar"
identifier = "estudiar"
weight = 10

[[main]]
name = "Plan de estudios"
pageRef = "/unmsm"
parent = "estudiar"
weight = 10
