baseURL = "https://web.caefisica.workers.dev/"
canonifyURLs = false
disableAliases = true
disableHugoGeneratorInject = true
enableEmoji = true
enableGitInfo = true
enableRobotsTXT = true
locale = "es-ES"
rssLimit = 10

[pagination]
pagerSize = 7

[outputs]
home = ["HTML", "RSS", "REDIRECTS", "HEADERS"]
section = ["HTML", "RSS"]

[mediaTypes."text/x-cloudflare-assets"]
suffixes = [""]
delimiter = ""

[outputFormats.REDIRECTS]
mediaType = "text/x-cloudflare-assets"
baseName = "_redirects"
isPlainText = true
notAlternative = true

[outputFormats.HEADERS]
mediaType = "text/x-cloudflare-assets"
baseName = "_headers"
isPlainText = true
notAlternative = true

[sitemap]
changefreq = "weekly"
filename = "sitemap.xml"
priority = 0.5

[frontmatter]
lastmod = [":git", "lastmod", "date", "publishDate"]

[taxonomies]
contributor = "contributors"
type = "types"
functionality = "functionalities"

[permalinks]
blog = "/blog/:title/"
types = "/experimental/types/:title/"
functionalities = "/experimental/functionalities/:title/"

[minify]
disableJs = false
[minify.tdewolff]
[minify.tdewolff.html]
keepWhitespace = false
[minify.tdewolff.js]
# https://github.com/tdewolff/minify/issues/472
keepVarNames = true
noNullishOperator = false
precision = 0
