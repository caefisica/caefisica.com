[hugoVersion]
extended = true
min = "0.146.0"
max = ""

[[mounts]]
source = "assets"
target = "assets"

[[mounts]]
source = "static"
target = "static"

[[mounts]]
source = "layouts"
target = "layouts"

[[mounts]]
source = "hugo_stats.json"
target = "assets/notwatching/hugo_stats.json"
disableWatch = true

[[mounts]]
source = "node_modules/mermaid"
target = "assets/js/vendor/mermaid"

[[mounts]]
source = "node_modules/katex"
target = "assets/js/vendor/katex"

[[mounts]]
source = "node_modules/pdfjs-dist"
target = "assets/js/vendor/pdfjs"
