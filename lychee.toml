# Muchos sitios de profesores solo sirven http.
scheme = ["http", "https"]

no_progress = true
max_concurrency = 16
timeout = 20
max_retries = 2

# Los sitios que bloquean a los bots devuelven 401, 403 y 429.
# Esos estados no indican páginas muertas.
accept = ["100..=103", "200..=299", "401", "403", "429"]

exclude = [
  # Dominios de Sci-Hub suelen estar bloqueados.
  '^https://sci-hub\.(se|st|ru)/',

  # Problemas de tiempo de espera (ETIMEDOUT).
  '^https://libgen\.li/',

  '^https://b-ok\.cc/',

  # Muchos grupos de investigación del VRIP fallan con errores de conexión.
  '^https://vrip\.unmsm\.edu\.pe/',

  # Responde 468, un estado que ningún estándar define.
  '^https://revistasinvestigacion\.unmsm\.edu\.pe/',

  '^https://www\.ilectureonline\.com/',

  # UNABLE_TO_VERIFY_LEAF_SIGNATURE
  '^http://www\.bne\.es/',
  '^https://hemerotecadigital\.bne\.es/',

  '^https://www\.doitpoms\.ac\.uk/',
  '^https://annas-archive\.gd/',
  '^https://www\.fuw\.edu\.pl/faculty-of-physics-home\.html',
  '^https://physics\.dfa\.unipd\.it/index\.php\?id=143',

  # ECONNRESET
  '^https://dictionary\.cambridge\.org/es/diccionario/espanol-ingles/',

  # CERT_HAS_EXPIRED
  '^https://www\.fis\.puc-rio\.br/en/',
]
