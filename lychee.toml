# Many lecturers' sites serve http only.
scheme = ["http", "https"]

no_progress = true
max_concurrency = 16
timeout = 20
max_retries = 2

# Sites that block bots answer 401, 403 and 429. Those statuses do not mean a
# dead page.
accept = ["100..=103", "200..=299", "401", "403", "429"]

exclude = [
  # Sci-Hub domains are often blocked.
  '^https://sci-hub\.(se|st|ru)/',

  # Time-out problems (ETIMEDOUT).
  '^https://libgen\.li/',

  '^https://b-ok\.cc/',

  # Many VRIP research groups fail with connection errors.
  '^https://vrip\.unmsm\.edu\.pe/',

  # Answers 468, a status no standard defines.
  '^https://revistasinvestigacion\.unmsm\.edu\.pe/',

  '^https://www\.ilectureonline\.com/',

  # UNABLE_TO_VERIFY_LEAF_SIGNATURE
  '^http://www\.bne\.es/',
  '^https://hemerotecadigital\.bne\.es/',

  '^https://www\.doitpoms\.ac\.uk/',
  '^https://annas-archive\.gd/',
  '^https://www\.fuw\.edu\.pl/faculty-of-physics-home\.html',
  '^https://physics\.dfa\.unipd\.it/index\.php\?id=143',

  # ECONNRESET
  '^https://dictionary\.cambridge\.org/es/diccionario/espanol-ingles/',

  # CERT_HAS_EXPIRED
  '^https://www\.fis\.puc-rio\.br/en/',
]
