    resueltos. En español.
- title: Óptica - Física
  channel: unicoos
  lecturer: David Calle
  url: https://www.youtube.com/playlist?list=PLOa7j0qx0jgN25SjjO0CJ-NG0czFF_s4O
  description: >-
    Seis ejercicios de nivel de bachillerato: la ley de Snell y la reflexión
    total, espejos cóncavos y convexos, y lentes convergentes y divergentes. En
    español.
- title: Optics course (2020)
  channel: ""
  lecturer: Dr. Adel Abdelshafik
