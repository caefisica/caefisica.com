- title: Óptica Física
  channel: rentov
  person: renato-tovar-landeo
  url: https://www.youtube.com/playlist?list=PLK_B1a9wXn7cxtcaclAHvELexp_2OFM1c
  description: >-
    Más de 140 videos de teoría y problemas: óptica geométrica y principio de
    Fermat, ondas electromagnéticas y su intensidad, superposición,
    interferencia e interferómetros, coherencia, difracción, polarización,
    fórmulas de Fresnel, análisis espectral y ensanchamiento de las líneas
    espectrales. En español.
- title: Curso de óptica y física moderna
  channel: ""
  lecturer: Isaías Rojas
  url: https://www.youtube.com/playlist?list=PL1Ztlverqb4rVFJQK_3ysBllIeW9iNqnx
  description: >-
    Las clases de Física General IV de la Universidad Técnica Federico Santa
    María: ecuaciones de Maxwell, ondas electromagnéticas, reflexión,
    refracción, polarización y difracción, y luego relatividad, fotones, los
    modelos atómicos, el espín y la radiación de cuerpo negro. En español.
- title: Tema 4. Ondas y óptica
  channel: EntropíaNegativa
  lecturer: ""
  url: https://www.youtube.com/playlist?list=PLBMRQ0GOZVeUBIv9Zr5auFnVcDXn3yDHh
  description: >-
    Ondas y óptica de primer año universitario: ondas armónicas, efecto Doppler,
    leyes de Snell, lentes y formación de imágenes, la visión del ojo, con
    problemas resueltos. En español.
- title: Curso de Óptica Geométrica
  channel: Topos Uranos
  lecturer: ""
  url: https://www.youtube.com/playlist?list=PL_C8rbeFjqAWf4vOMzs7reXie5fNKcGb0
  description: >-
    Nueve videos de óptica geométrica: espejos planos, refracción y principio de
