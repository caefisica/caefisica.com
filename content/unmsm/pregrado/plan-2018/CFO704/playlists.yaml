- title: Termodinámica y Física Estadística
  channel: Física Exactas UBA
  lecturer: Esteban Calzetta
  videos: "52"
  url: https://www.youtube.com/playlist?list=PLNbPNPgqTfs48kKZb_eGI6gdI5C9Kc3u7
  description: >-
    Un curso de la Universidad de Buenos Aires que va de la probabilidad y la
    teoría cinética a temas de investigación: relaciones de Onsager, trinquete
