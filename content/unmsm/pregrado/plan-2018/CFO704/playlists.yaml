    Hawking. Incluye clases prácticas y charlas de doctorandos. En español.
- title: "Clases IB en línea: Mecánica estadística"
  channel: Instituto Balseiro - Académico
  lecturer: Dr. Damián H. Zanette
  videos: "29"
  url: https://www.youtube.com/playlist?list=PLv0-vSkgrxj-5sd5SmNX3h4ZgqGw5xmTl
  description: >-
    El curso de Mecánica estadística del Instituto Balseiro (Argentina), en
    clases completas: hipótesis ergódica, ensambles microcanónico, canónico y
    gran canónico, gases cuánticos, condensación de Bose, fonones, campo medio,
    transiciones de fase y superconductividad. En español.
- title: Statistical Mechanics
  channel: Universidad de Stanford
  lecturer: Leonard Susskind
  videos: "10"
  url: https://www.youtube.com/playlist?list=PLpi18tMShZSAQFNTb8Ji7EgCFP9lXbkOe
  description: >-
    Diez clases de Leonard Susskind en Stanford, de casi dos horas cada una:
