- title: MIT 18.02 Multivariable Calculus (2007)
  channel: Robert McPherson
  lecturer: Denis Auroux
  url: https://www.youtube.com/playlist?list=PLYzxBBT5iehMCyHxKZOg9EMETK3nLBbfC
  description: >-
    Las 35 clases de 18.02 que Denis Auroux dictó en el MIT en otoño de 2007:
    producto punto, planos, derivadas parciales, multiplicadores de Lagrange,
    integrales dobles y triples, campos vectoriales e integrales de línea, y los
    teoremas de Green, de la divergencia y de Stokes. En inglés.
