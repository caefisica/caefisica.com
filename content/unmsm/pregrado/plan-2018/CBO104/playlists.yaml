- title: MIT 18.01 Single Variable Calculus, Fall 2006
  channel: MIT OpenCourseWare
  lecturer: David Jerison
  videos: "35"
  url: https://www.youtube.com/playlist?list=PL590CCC2BC5AF3BC1
  description: >-
    El curso de cálculo de una variable del MIT, clase por clase: derivadas y
    sus aplicaciones, integrales, técnicas de integración y series. Las clases
    8, 17, 27 y 34 fueron exámenes y no tienen video. En inglés.
- title: Funciones
  channel: MateFácil
  lecturer: Félix E. López Jara
  videos: "39"
  url: https://www.youtube.com/playlist?list=PL9SnRnlzoyX05sjBvbujQWjRFjLUOuVxb
  description: >-
    Ejercicios cortos resueltos paso a paso: qué es una función, dominio y
    rango, operaciones, composición, funciones inyectivas y suprayectivas, y
    gráficas, incluidas las definidas a trozos. En español.
- title: Límites
  channel: MateFácil
  lecturer: Félix E. López Jara
  videos: "172"
  url: https://www.youtube.com/playlist?list=PL9SnRnlzoyX0o0z-YWbg6P3Pz9I0xlklS
  description: >-
    Más de 150 límites resueltos uno por video: indeterminaciones 0/0 por
    factorización y racionalización, límites al infinito, trigonométricos, con
    la regla de L'Hôpital y algunos de varias variables. En español.
- title: Curso completo de derivadas
  channel: Matefácil
  lecturer: Félix E. López Jara
  videos: "205"
  url: https://www.youtube.com/playlist?list=PL9SnRnlzoyX1kIbHdA7GN-6g-hvkyLbWp
  description: >-
    La derivada desde su significado hasta sus aplicaciones, con un ejercicio de
    pocos minutos por video: reglas de derivación, regla de la cadena, funciones
    trigonométricas, exponenciales y logarítmicas, aproximaciones y máximos y
    mínimos. En español.
- title: Integración
  channel: ""
