- title: "Temas 'problemáticos' del Cálculo"
  channel: ""
  lecturer: Daniel Rubin
  videos: "8"
  url: https://www.youtube.com/playlist?list=PLw3pvR_YJeRcMaubDZvkjayqDJT4Tx47A
  description: >-
    Demostraciones cuidadosas de lo que un curso de cálculo suele dar por
