  channel: Robert Talbert
  lecturer: Gilbert Strang
  url: https://www.youtube.com/playlist?list=PL49CF3715CB9EF31D
  description: >-
    Las 35 clases de 18.06 que Gilbert Strang dictó en el MIT en 2005:
