<dialog
	id="video-dialog"
	aria-label="Video de presentación"
	class="m-auto max-w-[90vw] overflow-visible bg-transparent p-0 text-white backdrop:bg-gray-900/80">
	<form method="dialog" class="text-right">
		<button
			type="submit"
			class="px-2 text-4xl leading-none"
			aria-label="Cerrar el video">
			<span aria-hidden="true">×</span>
		</button>
	</form>
	<div id="player" class="aspect-video w-225 max-w-full"></div>
</dialog>

<section class="mx-auto flex min-h-[80vh] w-full max-w-[1200px] items-center justify-center px-6 text-center">
	<div class="-mx-6 flex w-full flex-wrap items-center justify-between">
		<div class="w-full px-6 text-center lg:w-7/16 lg:text-left">
			<h1 class="mt-0 mb-4 text-[2.3rem]">Una guía para el estudio de las Ciencias Físicas</h1>
			<p class="mb-6 text-[calc(1.275rem+0.3vw)] xl:text-xl">{{ .Params.Lead | safeHTML -}}</p>
			{{ if partial "components/is-search-enabled.html" . -}}
				<div class="home-search">
					<div id="docsearch"></div>
				</div>
			{{ end -}}
			<p class="mt-4 mb-0 text-base">Un proyecto del {{ .Site.Params.titleAddition }}</p>
		</div>
		<div class="hidden w-full px-6 lg:block lg:w-7/16">
			{{ with hugo.Data.fixes.frontpage -}}
				<div class="relative ml-auto">
					<img class="h-full w-full mask-contain mask-center mask-no-repeat [mask-image:url('/images/shape/hero-mask-svg.png')]" loading="lazy" src="{{ .image | relURL }}" alt="{{ .image_alt | markdownify -}}" title="{{ .image_title | markdownify -}}"/>

					{{ if .videoURL -}}
						<div class="absolute bottom-20 left-0 -translate-x-1/2 transition-all duration-300 group">
							<div class="relative h-40 w-62.5 overflow-hidden rounded-2xl after:absolute after:inset-0 after:z-1 after:bg-black/60">
								<img class="h-full w-full object-cover" src="{{ .videoThumb -}}" loading="lazy" alt="{{ .videoThumb_alt | markdownify -}}" title="{{ .videoThumb_title | markdownify -}}"/>
							</div>
							<button
								id="play-video"
								type="button"
								data-video-id="{{ .videoURL -}}"
								class="absolute top-1/2 left-1/2 z-2 flex size-15 -translate-x-1/2 -translate-y-1/2 items-center justify-center rounded-full bg-white pl-1 text-indigo-700 transition-all duration-300 hover:scale-110 hover:bg-indigo-700 hover:text-white group-hover:scale-110"
								aria-haspopup="dialog"
								aria-label="Mirar video de Youtube">
								<svg class="fill-current" xmlns="http://www.w3.org/2000/svg" width="21" height="24" viewBox="0 0 21 24" aria-hidden="true">
									<path d="M17.961 10.264a2 2 0 010 3.473L2.992 22.29A2 2 0 010 20.554V3.446A2 2 0 012.992 1.71z"
										data-name="Polygon 4" />
								</svg>
							</button>
						</div>
					{{ end -}}
				</div>
			{{ end -}}
		</div>
	</div>
</section>
