<section class="bg-surface py-section" aria-labelledby="que-hacemos">
	<div class="mx-auto w-full max-w-page px-gutter">
		<ul class="m-0 grid list-none gap-6 p-0 md:grid-cols-2 lg:grid-cols-3">
			<li class="reveal flex flex-col justify-center py-4 md:col-span-2 lg:col-span-1 lg:pr-8">
				<h2 id="que-hacemos" class="mt-0 mb-4 text-title">Conoce más sobre lo que hacemos</h2>
				<p class="mb-0 text-muted">
					¿Eres estudiante de primer semestre?
					<a class="learn font-bold whitespace-nowrap" href="{{ "unmsm/pregrado/" | relURL }}">Comienza aquí{{ partial "components/learn-chevron.html" }}</a>
				</p>
			</li>
			{{ range hugo.Data.content.features -}}
				<li class="reveal card card-hover p-6 md:p-8">
					<h3 class="mt-0 mb-3 text-xl font-bold">
						<a class="text-fg after:absolute after:inset-0 hover:text-fg hover:no-underline" href="{{ .link | relURL }}">{{ .title | markdownify }}</a>
					</h3>
					<p class="m-0 text-muted">{{ .description | markdownify }}</p>
				</li>
			{{ end -}}
		</ul>
	</div>
</section>
