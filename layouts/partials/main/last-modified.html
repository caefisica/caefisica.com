{{- if and .GitInfo .Site.Params.docsRepo -}}
	{{- $commitPath := default "commit" .Site.Params.BookCommitPath -}}
	<p class="my-1 text-sm md:mt-3 md:text-base">
		<a href="{{ .Site.Params.docsRepo }}/{{ $commitPath }}/{{ .GitInfo.Hash }}">
			<svg
				xmlns="http://www.w3.org/2000/svg"
				width="16"
				height="16"
				viewBox="0 0 24 24"
				fill="none"
				stroke="currentColor"
				stroke-width="2"
				stroke-linecap="round"
				stroke-linejoin="round"
				class="mr-2 mb-1"
			>
				<rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
				<line x1="16" y1="2" x2="16" y2="6"></line>
				<line x1="8" y1="2" x2="8" y2="6"></line>
				<line x1="3" y1="10" x2="21" y2="10"></line>
			</svg>{{- " " -}}Modificado por última vez el {{ .Lastmod.Day }} de {{ index (hugo.Data.fixes.months) (printf "%d" .Lastmod.Month) }} del {{ .Lastmod.Year }}
		</a>
	</p>
{{- end -}}
