{{- /*
Recibe `page`, `src`, `alt` y `class` en un `dict` y muestra la imagen solicitada.
*/ -}}
{{- $image := .page.Resources.GetMatch (printf "*%s*" .src) -}}
{{- $img := partial "components/image-srcset.html" (dict "image" $image) -}}

<figure{{ with .class }} class="{{ . }}"{{ end }}>
	<img
		class="lazyload blur-up"
		data-sizes="auto"
		src="{{ $img.lqip }}"
		data-srcset="{{ $img.srcset }}"
		width="{{ $image.Width }}"
		height="{{ $image.Height }}"
		{{ with .alt }}alt="{{ . }}"{{ end }}
	>
	<noscript><img
			sizes="100vw"
			srcset="{{ $img.srcset }}"
			src="{{ $img.src }}"
			width="{{ $image.Width }}"
			height="{{ $image.Height }}"
			{{ with .alt }}alt="{{ . }}"{{ end }}
		>
	</noscript>
</figure>
