{{ if or .Prev .Next -}}
	<div class="docs-navigation flex justify-between">
		{{ $pages := where site.RegularPages "Section" .Section -}} 
		{{ with $pages.ByWeight.Next . -}}
			<a class="card card-hover my-1 block px-4 py-2 no-underline" href="{{ .RelPermalink }}">
				&larr; {{ .Title }}
			</a>
		{{ end -}} 
		{{ with $pages.ByWeight.Prev . -}}
			<a class="card card-hover my-1 ms-auto block px-4 py-2 no-underline" href="{{ .RelPermalink }}">
				{{ .Title }} &rarr;
			</a>
		{{ end -}}
	</div>
{{ end -}}
