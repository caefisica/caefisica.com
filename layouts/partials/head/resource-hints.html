{{ if not .IsHome -}}
	<link
		rel="preload"
		as="font"
		href="{{ "fonts/vendor/jost/jost-v4-latin-regular.woff2" | relURL }}"
		type="font/woff2"
		crossorigin />
	<link
		rel="preload"
		as="font"
		href="{{ "fonts/vendor/jost/jost-v4-latin-700.woff2" | relURL }}"
		type="font/woff2"
		crossorigin />
{{ end -}}
{{ if partial "components/is-search-enabled.html" . -}}
	<link
		rel="preconnect"
		href="https://{{ .Site.Params.search.appId }}-dsn.algolia.net"
		crossorigin />
{{ end -}}
{{ if and .Site.Params.options.kaTex .Params.math -}}
	<link
		rel="preload"
		as="font"
		href="{{ "fonts/KaTeX_Main-Regular.woff2" | relURL }}"
		type="font/woff2"
		crossorigin />
	<link
		rel="preload"
		as="font"
		href="{{ "fonts/KaTeX_Math-Italic.woff2" | relURL }}"
		type="font/woff2"
		crossorigin />
{{ end -}}
