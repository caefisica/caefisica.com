{{- /* Every page preloads the two weights above the fold, the home page included: without them the text paints in the fallback font and then shifts. */ -}}
<link
	rel="preload"
	as="font"
	href="{{ "fonts/vendor/jost/jost-v4-latin-regular.woff2" | relURL }}"
	type="font/woff2"
	crossorigin />
<link
	rel="preload"
	as="font"
	href="{{ "fonts/vendor/jost/jost-v4-latin-700.woff2" | relURL }}"
	type="font/woff2"
	crossorigin />

{{ if and .Site.Params.options.kaTex .Params.math -}}
	<link
		rel="preload"
		as="font"
		href="{{ "fonts/KaTeX_Main-Regular.woff2" | relURL }}"
		type="font/woff2"
		crossorigin />
	<link
		rel="preload"
		as="font"
		href="{{ "fonts/KaTeX_Math-Italic.woff2" | relURL }}"
		type="font/woff2"
		crossorigin />
{{ end -}}
