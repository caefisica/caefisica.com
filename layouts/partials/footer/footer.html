<footer class="border-t border-dashed border-line py-[1.125rem] text-muted">
	<div class="mx-auto w-full max-w-page px-gutter">
		<div class="flex flex-col-reverse justify-between gap-x-12 lg:flex-row">
			<p class="mb-0 text-sm md:text-base">{{ .Site.Params.footer | safeHTML }}</p>
			<ul class="m-0 flex list-none flex-wrap gap-x-2 p-0 text-sm md:text-base lg:text-right">
				{{ range .Site.Menus.footer -}}
					<li>
						<a href="{{ .URL | relLangURL }}">{{ .Name }}</a>
					</li>
				{{ end -}}
			</ul>
		</div>
	</div>
</footer>
