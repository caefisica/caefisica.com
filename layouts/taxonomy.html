{{ define "main" }}
<div class="col-prose py-page">
	{{ partial "ui/page-head.html" (dict "page" . "lead" .Description) }}
	<ul class="people">
		{{- range .Pages }}
			<li class="person">
				{{ partial "ui/avatar.html" (dict "page" . "size" 64) }}
				<div>
					<a class="card-link font-medium" href="{{ .RelPermalink }}">{{ .Title }}</a>
					{{- with .Description }}<p>{{ . }}</p>{{ end }}
				</div>
			</li>
		{{- end }}
	</ul>
</div>
{{ end }}
