{{- /* Numbered index of pages. Context: pages. Each row is a title. A course adds its code and credits on the right. */ -}}
<ul class="section-cards">
	{{- range . }}
		<li class="group">
			<a class="card-link" href="{{ .RelPermalink }}">{{ .Title }}</a>
			{{- if .Params.credits }}
				<p>{{ .Params.id }} · {{ .Params.credits }} créditos</p>
			{{- end }}
		</li>
	{{- end }}
</ul>
