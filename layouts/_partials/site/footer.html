<footer class="border-t border-dashed border-line py-6 text-sm text-muted">
	<div class="mx-auto flex w-full max-w-page flex-col-reverse justify-between gap-x-12 gap-y-2 px-gutter md:flex-row">
		<p class="m-0">{{ site.Params.footer }}</p>
		<ul class="m-0 flex list-none flex-wrap gap-x-4 p-0">
			{{- range site.Menus.footer }}
				<li><a class="text-muted hover:text-link" href="{{ .URL }}">{{ .Name }}</a></li>
			{{- end }}
		</ul>
	</div>
</footer>
