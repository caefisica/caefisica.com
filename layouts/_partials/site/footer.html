{{- /* The name in the first column, then one column of links per footer menu parent. */ -}}
<footer class="border-t border-edge pt-14 pb-10 text-sm">
	<div class="mx-auto grid w-full max-w-page grid-cols-2 gap-x-6 gap-y-10 px-gutter md:grid-cols-4">
		<div class="col-span-2 md:col-span-1">
			<a class="font-semibold text-fg" href="{{ "/" | relURL }}">{{ site.Params.title }}</a>
			<p class="mt-2 mb-0 max-w-[24ch] text-muted">{{ site.Params.footer }}</p>
		</div>
		{{- range site.Menus.footer }}
			<nav aria-labelledby="footer-{{ .Identifier }}">
				<h2 id="footer-{{ .Identifier }}" class="m-0 mb-4 text-sm font-medium text-fg">{{ .Name }}</h2>
				<ul class="m-0 grid list-none gap-2.5 p-0">
					{{- range .Children }}
						<li><a class="text-muted hover:text-fg" href="{{ .URL }}">{{ .Name }}</a></li>
					{{- end }}
				</ul>
			</nav>
		{{- end }}
	</div>
</footer>
