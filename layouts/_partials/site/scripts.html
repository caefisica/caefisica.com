{{- $hasCode := strings.Contains .Content "<pre" -}}
{{- $build := dict "target" "es2020" "minify" hugo.IsProduction "sourceMap" (cond hugo.IsProduction "none" "inline") -}}

{{- partial "site/script.html" (dict "src" "js/search.ts" "load" "after-load" "params" (dict "bundlePath" ("pagefind/" | relURL))) -}}

{{- /* navigation.ts and its companions ship as one file. Hugo caches resources.Concat by target name, so each combination needs its own name. */ -}}
{{- $parts := slice "navigation" -}}
{{- if and site.Params.options.clipBoard $hasCode }}{{ $parts = $parts | append "clipboard" }}{{ end -}}
{{- if site.Params.options.instantPage }}{{ $parts = $parts | append "instant-page" }}{{ end -}}
{{- $bundle := slice -}}
{{- range $parts }}{{ $bundle = $bundle | append (resources.Get (printf "js/%s.ts" .) | js.Build $build) }}{{ end -}}
{{- partial "site/load-after.html" ($bundle | resources.Concat (printf "js/%s.js" (delimit $parts "+"))) -}}

{{- if and site.Params.options.highLight $hasCode -}}
	{{- partial "site/script.html" (dict "src" "js/highlight.ts") -}}
{{- end -}}
{{- if .Params.math -}}
	{{- range slice "katex.js" "contrib/auto-render.js" -}}
		{{- partial "site/script-tag.html" (dict "res" (resources.Get (print "js/vendor/katex/dist/" .)) "attr" "defer") -}}
	{{- end -}}
	{{- partial "site/script.html" (dict "src" "js/katex.ts") -}}
{{- end -}}
{{- if .Params.mermaid -}}
	{{- partial "site/script.html" (dict "src" "js/mermaid.ts") -}}
{{- end -}}
{{- /* media/document.html sets the mark while the main block renders, before this partial runs. */ -}}
{{- if .Store.Get "pdf" -}}
	{{- $lib := resources.Get "js/vendor/pdfjs/build/pdf.min.mjs" | fingerprint -}}
	{{- $worker := resources.Get "js/vendor/pdfjs/build/pdf.worker.min.mjs" | fingerprint -}}
	{{- partial "site/script.html" (dict "src" "js/pdf-viewer.ts" "params" (dict "lib" $lib.RelPermalink "worker" $worker.RelPermalink)) -}}
{{- end -}}
{{- if .IsHome -}}
	{{- partial "site/script.html" (dict "src" "js/player.ts") -}}
{{- end -}}
