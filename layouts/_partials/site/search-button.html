{{- /* Opens the search dialog. Context: dict with class, and field true for the wide version that shows the shortcut. */ -}}
<button class="{{ .class }}" type="button" data-search-open aria-haspopup="dialog" aria-keyshortcuts="Control+K /" aria-label="Buscar">
	{{ partial "ui/icon.html" "search" }}
	{{- if .field }}
		<span class="hidden lg:inline" aria-hidden="true">Buscar</span>
		<span class="ml-auto hidden gap-1 lg:inline-flex" aria-hidden="true"><kbd class="kbd" data-kbd-mod>Ctrl</kbd><kbd class="kbd">K</kbd></span>
	{{- end }}
</button>
