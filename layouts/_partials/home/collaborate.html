{{- /* The call to join: open an issue on the site repository or write to us. */ -}}
<section class="mx-auto w-full max-w-page px-gutter" aria-labelledby="colaborar">
	<div class="cta">
		<h2 id="colaborar" class="reveal">¿Deseas colaborar?</h2>
		<p class="reveal m-0 flex flex-wrap justify-center gap-3">
			<a class="btn btn-solid" href="{{ site.Params.docsRepo }}/issues/new">Dar una recomendación</a>
			<a class="btn btn-outline" href="{{ "contacto/" | relURL }}">Contáctanos</a>
		</p>
	</div>
</section>
