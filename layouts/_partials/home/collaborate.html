{{- /* The call to join: open an issue on the site repository or write to us. */ -}}
<section class="band py-section" aria-labelledby="colaborar">
	<div class="mx-auto w-full max-w-page px-gutter">
		<div class="card home-card mx-auto max-w-[42rem] p-8 md:p-12 md:text-center">
			<h2 id="colaborar" class="reveal mt-0 mb-4 text-title">¿Deseas colaborar?</h2>
			<p class="reveal mx-auto mb-8 max-w-[36rem] text-lead">
				Si estudias Física, puedes compartir una recomendación o ayudar a mejorar
				una guía.
			</p>
			<p class="reveal m-0 flex flex-wrap gap-3 md:justify-center">
				<a class="btn btn-solid" href="{{ site.Params.docsRepo }}/issues/new">Quiero dar una recomendación</a>
				<a class="btn btn-outline" href="{{ "contacto/" | relURL }}">Contáctanos</a>
			</p>
		</div>
	</div>
</section>
