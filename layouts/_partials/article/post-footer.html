{{- /* Context: the page. */ -}}
{{- $copy := site.Params.options.clipBoard -}}
{{- if $copy }}{{ .Store.Set "copy" true }}{{ end -}}
<footer class="post-footer" data-pagefind-ignore="all">
	{{ partial "article/post-meta.html" . }}
	{{- if $copy }}
		<button class="copy-link" type="button" data-clipboard-text="{{ .Permalink }}" data-copied="Enlace copiado">Copiar enlace</button>
	{{- end }}
</footer>
