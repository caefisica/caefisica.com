{{- /* Context: dict with page and optional tabs (a slice of dicts with value and label, the first checked). The tabs switch views only inside a .views block. */ -}}
{{- $page := .page }}
<header class="index-head">
	<h1>{{ $page.Title }}</h1>
	{{- with .tabs }}
		<fieldset class="index-tabs">
			<legend class="sr-only">Ver por</legend>
			{{- range $i, $tab := . }}
				<label><input type="radio" name="vista" value="{{ $tab.value }}"{{ if eq $i 0 }} checked{{ end }} /><span>{{ $tab.label }}</span></label>
			{{- end }}
		</fieldset>
	{{- end }}
</header>
