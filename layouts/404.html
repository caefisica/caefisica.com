{{ define "main" }}
<section class="not-found">
	{{ partial "site/ghost.html" . }}
	<div>
		<h1>No encontramos esta página {{ ":pensive:" | emojify }}</h1>
		<p class="text-lead">Puede que se haya movido. Búscala o vuelve al inicio.</p>
		<p class="flex flex-wrap gap-3">
			<button class="btn btn-solid" type="button" data-search-open aria-haspopup="dialog">Buscar en el sitio</button>
			<a class="btn btn-outline" href="{{ "/" | relURL }}">Ir al inicio</a>
		</p>
	</div>
</section>
{{ end }}
