{{ define "main" }}
<div class="py-page">
	{{ partial "ui/index-head.html" (dict "page" .) }}
	<ul class="rows row-grid">
		{{- range .Params.channels }}
			<li class="group">
				<a class="card-link" href="{{ .url }}">{{ .name }}</a>
				<p>{{ .note }}</p>
				<span class="row-meta">{{ .handle }}</span>
			</li>
		{{- end }}
	</ul>
</div>
{{ end }}
