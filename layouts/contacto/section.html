{{ define "main" }}
<div class="flex h-[calc(100vh-100px-1.72rem)] items-center">
	<article class="col-prose">
		<h1>{{ .Title }}</h1>
		<div class="markdown">{{ .Content }}</div>
		<div class="mt-9 flex flex-col gap-8">
			{{ range .Pages -}}
				{{ partial "components/card.html" (dict
					"title" .Params.title
					"url" .RelPermalink
					"lead" .Params.lead
				)
				-}}
			{{ end -}}
		</div>
	</article>
</div>
{{ end }}
