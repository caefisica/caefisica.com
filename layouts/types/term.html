{{ define "main" }}
<div class="-mx-6 flex flex-wrap justify-between xl:flex-nowrap">
	{{ partial "sidebar/aside.html" (dict "page" . "menu" "sidebar/showcase-menu.html" "label" "Main navigation") }}
	<main class="order-1 w-full px-6 pb-12 lg:w-11/16 xl:mx-auto xl:w-10/16">
		<h1 class="text-center">{{ .Title | title }}</h1>
		<p class="text-lead text-center">Artículos relacionados a {{ .Title }}</p>
		<h2>Reciente</h2>
		<div class="grid grid-cols-1 gap-12 md:grid-cols-2">
			{{ range .Pages.ByWeight.Reverse -}}
				{{ .Render "showcase-card" -}}
			{{ end }}
		</div>
	</main>
</div>
{{ end }}
