<!doctype html>
<html lang="{{ .Site.Language.Locale | default "es" }}">
	{{ partial "head/head.html" . }}
	{{ partial "head/body-class.html" . -}}
	<body class="{{ delimit (.Store.Get "class") " " }}">
		{{ partial "header/header.html" . }}
		<div class="mx-auto w-full max-w-page px-6" role="document">
			<div{{ if ne .Kind "404" }} data-pagefind-body{{ end }}>
				{{ block "main" . }}{{ end }}
			</div>
		</div>
		{{ block "prefooter" . }}{{ end }}
		{{ block "footer-widgets" . }}{{ end }}
		{{ partial "footer/footer.html" . }}
		{{ partial "footer/script-footer.html" . }}
	</body>
</html>
