<aside class="relative mt-4 mb-8 rounded-md rounded-bl-[3px] border-l-3 border-indigo-500 bg-indigo-100/35 pt-7 pr-8 pb-8 pl-[29px] xl:-mx-8 dark:border-indigo-600 dark:bg-surface">
	<div class="absolute top-0 left-0 -translate-x-1/2 -translate-y-1/2 rounded-full bg-bg p-2 text-indigo-500 dark:text-indigo-600">
		<svg
			xmlns="http://www.w3.org/2000/svg"
			width="32"
			height="32"
			viewBox="0 0 24 24"
			fill="none"
			stroke="currentColor"
			stroke-width="2"
			stroke-linecap="round"
			stroke-linejoin="round"
		>
			<circle cx="12" cy="12" r="10"></circle>
			<line x1="12" y1="16" x2="12" y2="12"></line>
			<line x1="12" y1="8" x2="12.01" y2="8"></line>
		</svg>
	</div>
	{{ with .Get "text" }}
		<div class="w-full">{{ . | safeHTML }}</div>
	{{ else }} 
		{{ with .Inner }}
			<div class="w-full">{{ . | markdownify }}</div>
		{{ else }}
			{{ errorf "No valid text variable or Inner content given" }} 
		{{ end }} 
	{{ end }}
</aside>
