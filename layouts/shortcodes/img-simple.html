{{ $image := .Page.Resources.GetMatch (printf "*%s*" (.Get "src")) -}}
<img
	class="img-simple{{ with .Get "class" }} {{ . }}{{ end }}"
	loading="lazy"
	decoding="async"
	src="{{ $image.RelPermalink }}"
	width="{{ $image.Width }}"
	height="{{ $image.Height }}"
	{{ with .Get "alt" }}alt="{{ . }}"{{ end }} />
