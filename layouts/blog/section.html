{{ define "main" }}
<div class="col-prose">
	<article>
		<h1 class="text-center">{{ .Title }}</h1>
		<div class="markdown text-center">{{ .Content }}</div>
		<div class="mt-9 flex flex-col gap-8">
			{{ range .Pages.Reverse -}}
				{{ partial "components/card.html" (dict
					"title" .Params.title
					"url" .RelPermalink
					"emoji" .Params.emoji
					"lead" .Params.lead
					"meta" .
				)
				-}}
			{{ end -}}
		</div>
	</article>
</div>
{{ end }}
