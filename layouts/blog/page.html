{{ define "main" }}
<div class="col-prose">
	<article class="markdown">
		<div class="mb-8 text-center">
			<h1>{{ .Title }}{{ with .Params.emoji -}} &nbsp;{{ . | emojify }} {{ end -}}</h1>
			{{ partial "main/blog-meta.html" (dict "page" . "single" true) }}
		</div>
		<p class="text-lead">{{ .Params.lead | safeHTML }}</p>
		{{ .Content }}
	</article>
</div>
{{ end }}
