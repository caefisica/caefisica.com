{{ define "main" }}
<div class="-mx-6 flex justify-center">
	<main class="w-full px-6 pb-12 lg:w-11/16 xl:mx-auto xl:w-10/16">
		<div class="mx-auto lg:max-w-240 xl:px-12">
			{{ partial "main/breadcrumbs.html" . }}
			<h1 class="m-0">{{ .Title }}</h1>
			<p class="text-lead">{{ .Params.lead | safeHTML }}</p>
			<div class="markdown">{{ .Content }}</div>
			{{ partial "main/docs-navigation.html" . }}
		</div>
	</main>
</div>
{{ end }}
