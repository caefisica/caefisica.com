{{ define "main" }}
<div class="py-12">
	<h1>{{ .Title }}</h1>
	{{ with .Description }}<p class="text-lead">{{ . }}</p>{{ end }}
	<div class="mt-4 grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
		{{ range .Pages }}
			<div class="relative rounded-md border border-black/15 bg-bg dark:border-white/15">
				<div class="p-4">
					<h5>
						<a href="{{ .RelPermalink }}">{{ partial "components/professor-name.html" . }}</a>
					</h5>
					{{ with .Params.institution }}
						<p class="text-sm text-muted">{{ . | upper }}</p>
					{{ end }}
				</div>
			</div>
		{{ end }}
	</div>
</div>
{{ end }}
