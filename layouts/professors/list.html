{{ define "main" }}
<div class="py-section">
	<h1>{{ .Title }}</h1>
	{{- with .Description }}<p class="text-lead">{{ . }}</p>{{ end }}
	<ul class="section-cards">
		{{- range .Pages.ByTitle }}
			<li class="card card-hover group">
				<a class="card-link" href="{{ .RelPermalink }}">{{ partial "data/professor-name.html" . }}</a>
				{{- with .Params.institution }}<p>{{ . | upper }}</p>{{ end }}
				{{ partial "ui/chevron.html" }}
			</li>
		{{- end }}
	</ul>
</div>
{{ end }}
